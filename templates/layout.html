<!DOCTYPE html>
<html lang="en">

    <title>{{ .Title }} | My Go Blog</title>
    <link rel="stylesheet" href="{{ .RootPath }}style.css">
</head>
<body>

            <nav>

        <p>&copy; 2026 My Go Blog &bull; Built with Go</p>

</html>
